apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: sadhana07/jen_img:latest  # Replace with your Docker image
        ports:
        - containerPort: 8095  # Your container's port
        

